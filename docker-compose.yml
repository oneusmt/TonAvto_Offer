version: "3.9"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    expose:
      - "3000"
    networks:
      - app

  backend:
    build:
      context: ./backend
    container_name: backend
    expose:
      - "8000"
    networks:
      - app

networks:
  app:
    driver: bridge
